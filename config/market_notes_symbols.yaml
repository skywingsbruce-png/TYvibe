# Market Notes — symbol recognition + conclusion time windows.
#
# Bare ALL-CAPS words are NOT auto-treated as tickers. A bare token becomes a
# symbol only when it is a known index, appears in your held book, or is on the
# whitelist below. Explicit cashtags ($SNDK) are always recognized. This keeps
# chat noise like FUD / TACO / AI / LOL out of the risk surface.

# Known indices / index-ETFs (bare mentions accepted).
indices:
  - SPX
  - SPY
  - QQQ
  - NDX
  - VIX
  - ES
  - NQ
  - IWM
  - DIA
  - RUT

# Human-maintained ticker whitelist. Edit to match the names you actually
# discuss. Anything not here (and not a cashtag / index / held underlying) stays
# plain text.
whitelist:
  - SNDK
  - SOXL
  - SOXX
  - SMH
  - MU
  - WDC
  - STX
  - NVDA
  - AMD
  - TSM
  - MRVL
  - AAPL
  - MSFT
  - GOOGL
  - GOOG
  - AMZN
  - META
  - TSLA
  - SMCI
  - AVGO

# Freshness windows for the "current conclusions" card. An opinion is included
# only when its timestamp parses AND its age is within the window for its
# horizon. Unknown-time opinions stay in history but never enter the card.
windows:
  intraday_hours: 24
  days_days: 7
  weeks_days: 30
  # Window applied to opinions whose horizon could not be determined.
  unknown_days: 7

# Theme keyword hints for Market Notes. Theme DEFINITIONS (labels, symbols, ETFs)
# are REUSED from config/market_radar.yaml — this section only maps a theme key
# there to explicit keywords. A note is associated to a theme by keyword ONLY
# when one of these configured keywords appears in the text; keywords are never
# inferred by an LLM. A note is associated by "direct_symbol" when a ticker it
# mentions belongs to that theme's symbols/ETFs. The two association types are
# always reported separately and never conflated.
theme_keywords:
  semiconductors: [semiconductor, semiconductors, semis, chips, chip, memory, dram, hbm, foundry, wafer, 半导体, 芯片, 内存]
  software: [software, saas]
  mag7: [mag7, magnificent seven, mega-cap tech, mega cap tech]
  optical_networking: [optical, transceiver, optics]
